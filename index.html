<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HARVIX</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <div class="orb-container">
            <div id="orb">
                <div class="orb-core">H</div>
            </div>
        </div>

        <h1>HARVIX</h1>

        <p class="subtitle">
            ASISTENTE PERSONAL
        </p>

        <div id="chat">

            <p class="harvix-message">
                Hola. Soy Harvix.
            </p>

        </div>

        <div class="controls">

            <input
                id="userInput"
                type="text"
                placeholder="Habla con Harvix..."
            >

            <button id="sendButton">
                ➤
            </button>

            <button id="micButton">
                🎙️
            </button>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
